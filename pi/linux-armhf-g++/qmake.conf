# Кросс-сборка под Raspberry Pi (Raspbian bookworm, 32-bit armhf) против sysroot с Pi.
# Используется из pi/build_cross.sh вместе с qt.conf, где задан Sysroot.

MAKEFILE_GENERATOR      = UNIX
CONFIG                 += incremental cross_compile
QMAKE_INCREMENTAL_STYLE = sublib

include($$[QT_HOST_DATA/src]/mkspecs/common/linux.conf)
include($$[QT_HOST_DATA/src]/mkspecs/common/gcc-base-unix.conf)
include($$[QT_HOST_DATA/src]/mkspecs/common/g++-unix.conf)

CROSS = arm-linux-gnueabihf-
QMAKE_CC         = $${CROSS}gcc
QMAKE_CXX        = $${CROSS}g++
QMAKE_LINK       = $${CROSS}g++
QMAKE_LINK_SHLIB = $${CROSS}g++
QMAKE_AR         = $${CROSS}ar cqs
QMAKE_OBJCOPY    = $${CROSS}objcopy
QMAKE_NM         = $${CROSS}nm -P
QMAKE_STRIP      = $${CROSS}strip

SYSROOT = $$[QT_SYSROOT]
QMAKE_CFLAGS   += --sysroot=$$SYSROOT
QMAKE_CXXFLAGS += --sysroot=$$SYSROOT
QMAKE_LFLAGS   += --sysroot=$$SYSROOT \
                  -Wl,-rpath-link,$$SYSROOT/usr/lib/arm-linux-gnueabihf

# libstdc++ местного gcc новее, чем на Pi (требует glibc 2.38) - линкуемся с libstdc++ из sysroot.
# Заголовки C++ тоже берём с Pi: заголовки местного gcc не совпадают с libstdc++ Pi по устройству классов,
# такая программа собирается, но может падать на Pi
PI_CXX_INC = $$files($$SYSROOT/usr/include/c++/*)
PI_CXX_VER = $$basename(PI_CXX_INC)
isEmpty(PI_CXX_VER): error("Нет заголовков C++ в $$SYSROOT/usr/include/c++ - запустите pi/sync_sysroot.sh")
QMAKE_CXXFLAGS += -nostdinc++ \
                  -isystem $$SYSROOT/usr/include/c++/$$PI_CXX_VER \
                  -isystem $$SYSROOT/usr/include/arm-linux-gnueabihf/c++/$$PI_CXX_VER \
                  -isystem $$SYSROOT/usr/include/c++/$$PI_CXX_VER/backward
QMAKE_LFLAGS   += -nostdlib++
QMAKE_LIBS     += -L$$SYSROOT/usr/lib/arm-linux-gnueabihf -l:libstdc++.so.6

# EGL/GLES на Pi
QMAKE_INCDIR_EGL      = $$SYSROOT/usr/include
QMAKE_INCDIR_OPENGL_ES2 = $$SYSROOT/usr/include

load(qt_config)
